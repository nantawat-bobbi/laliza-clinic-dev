function paintCourseForm(formCard, course, courseId){
  formCard.innerHTML = "";
  formCard.appendChild(el("div", {class:"eyebrow", style:"margin-bottom:12px;"}, ["ข้อมูลคอร์ส"]));

  const errBox = el("div", {class:"alert alert-error hidden"});
  formCard.appendChild(errBox);
  const successBox = el("div", {class:"alert alert-success hidden"}, ["บันทึกแล้ว"]);
  formCard.appendChild(successBox);

  formCard.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["ชื่อคอร์ส"]),
    el("input", {type:"text", id:"c-title", value:course.title}),
  ]));
  formCard.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["คำอธิบาย (ไม่บังคับ)"]),
    el("textarea", {id:"c-desc", rows:"2"}, [course.description || ""]),
  ]));
  formCard.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["ลิงก์เนื้อหาคอร์ส (YouTube, Google Drive, เว็บไซต์)"]),
    el("input", {type:"url", id:"c-link", value:course.link_url, placeholder:"https://..."}),
  ]));

  const row2 = el("div", {class:"field-row field-row-2"});
  row2.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["เกณฑ์ผ่าน (%)"]),
    el("input", {type:"number", id:"c-pass", min:"0", max:"100", value:String(course.pass_score_percent || 70)}),
  ]));
  row2.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["กำหนดสอบ (ไม่บังคับ)"]),
    el("input", {type:"date", id:"c-due", value:course.due_date || ""}),
  ]));
  formCard.appendChild(row2);

  if(courseId){
    const pubRow = el("label", {style:"display:flex; align-items:center; gap:10px; min-height:44px; margin-bottom:16px;"});
    const pubCheck = el("input", {type:"checkbox", id:"c-published", style:"width:18px; height:18px; accent-color:var(--ink);"});
    pubCheck.checked = course.is_published !== false;
    pubRow.appendChild(pubCheck);
    pubRow.appendChild(document.createTextNode("เผยแพร่ให้แพทย์เห็น"));
    formCard.appendChild(pubRow);
  }

  const btnRow = el("div", {style:"display:flex; flex-wrap:wrap; gap:12px;"});
  btnRow.appendChild(el("button", {class:"btn btn-primary", onClick: handleSave}, [courseId ? "บันทึกการแก้ไข" : "สร้างคอร์ส"]));
  if(courseId){
    btnRow.appendChild(el("button", {class:"btn-danger-text", onClick: handleDelete}, ["ลบคอร์สนี้"]));
  }
  formCard.appendChild(btnRow);

  async function handleSave(){
    const title = $("#c-title", formCard).value.trim();
    const description = $("#c-desc", formCard).value.trim();
    const linkUrl = $("#c-link", formCard).value.trim();
    const passScore = Number($("#c-pass", formCard).value) || 70;
    const dueDate = $("#c-due", formCard).value;
    errBox.classList.add("hidden");

    if(!title || !linkUrl){
      errBox.textContent = "กรุณากรอกชื่อคอร์สและลิงก์เนื้อหา";
      errBox.classList.remove("hidden");
      return;
    }

    const payload = {
      title, description, link_url: linkUrl,
      pass_score_percent: passScore, due_date: dueDate || null,
    };

    try{
      if(courseId){
        payload.is_published = $("#c-published", formCard).checked;
        payload.updated_at = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection(COL.courses).doc(courseId).update(payload);
        successBox.classList.remove("hidden");
        setTimeout(()=>successBox.classList.add("hidden"), 2000);
      } else {
        payload.is_published = true;
        payload.created_by = state.user.uid;
        payload.created_at = firebase.firestore.FieldValue.serverTimestamp();
        payload.created_at_ms = Date.now();
        const ref = await db.collection(COL.courses).add(payload);
        // Auto-create the two quiz shells
        await db.collection(COL.quizzes).add({ course_id: ref.id, kind:"knowledge", title:"แบบทดสอบความรู้", is_published:true, created_at_ms: Date.now() });
        await db.collection(COL.quizzes).add({ course_id: ref.id, kind:"survey", title:"แบบประเมินความเห็น", is_published:true, created_at_ms: Date.now() });
        state.route = `admin:course:${ref.id}`;
        render();
      }
    }catch(err){
      errBox.textContent = err.message || "เกิดข้อผิดพลาด";
      errBox.classList.remove("hidden");
    }
  }

  async function handleDelete(){
    if(!confirm("ลบคอร์สนี้และแบบทดสอบทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้")) return;
    // Delete quizzes + their questions, then the course
    const quizSnap = await db.collection(COL.quizzes).where("course_id","==",courseId).get();
    for(const qDoc of quizSnap.docs){
      const qSnap = await db.collection(COL.questions).where("quiz_id","==",qDoc.id).get();
      for(const qq of qSnap.docs) await db.collection(COL.questions).doc(qq.id).delete();
      await db.collection(COL.quizzes).doc(qDoc.id).delete();
    }
    await db.collection(COL.courses).doc(courseId).delete();
    state.route = "admin:courses";
    render();
  }
}
</script>

<script>
/* ============================================================
   ADMIN: QUIZ / QUESTION EDITOR (within course detail page)
   ============================================================ */
function paintQuizSection(quizSection, courseId, course){
  quizSection.innerHTML = "";
  quizSection.appendChild(el("div", {class:"spinner"}));

  db.collection(COL.quizzes).where("course_id", "==", courseId).get().then(snap => {
    const quizzes = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => a.kind === "knowledge" ? -1 : 1);
    quizSection.innerHTML = "";
    quizzes.forEach(quiz => quizSection.appendChild(buildQuizEditorCard(quiz, course)));
  });
}

const KIND_LABEL = { knowledge:"แบบทดสอบความรู้", survey:"แบบประเมินความเห็น" };

function buildQuizEditorCard(quiz, course){
  const isKnowledge = quiz.kind === "knowledge";
  const card = el("div", {class:"card", style:"margin-bottom:24px;"});
  const headRow = el("div", {style:"display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;"});
  headRow.appendChild(el("div", {class:"eyebrow"}, [KIND_LABEL[quiz.kind]]));
  const countLabel = el("span", {class:"muted", style:"font-size:13px;"}, ["..."]);
  headRow.appendChild(countLabel);
  card.appendChild(headRow);

  const qList = el("div", {style:"margin-bottom:16px;"});
  card.appendChild(qList);

  const formArea = el("div", {});
  card.appendChild(formArea);

  refreshQuestions();

  function refreshQuestions(){
    db.collection(COL.questions).where("quiz_id", "==", quiz.id).get().then(snap => {
      const questions = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(a.order_index||0)-(b.order_index||0));
      countLabel.textContent = `${questions.length} คำถาม`;
      qList.innerHTML = "";
      if(questions.length === 0){
        qList.appendChild(el("p", {class:"muted"}, ["ยังไม่มีคำถาม"]));
      }
      questions.forEach((q, idx) => {
        const row = el("div", {style:"border:1px solid var(--line); border-radius:4px; padding:14px; margin-bottom:10px;"});
        const top = el("div", {style:"display:flex; justify-content:space-between; gap:10px; align-items:flex-start;"});
        top.appendChild(el("p", {style:"font-size:14px; font-weight:500;"}, [el("span",{class:"q-number"},[`${idx+1}.`]), q.prompt]));
        const delBtn = el("button", {class:"btn-danger-text"}, ["ลบ"]);
        delBtn.addEventListener("click", async () => {
          if(!confirm("ลบคำถามนี้?")) return;
          await db.collection(COL.questions).doc(q.id).delete();
          refreshQuestions();
        });
        top.appendChild(delBtn);
        row.appendChild(top);

        if(q.choices && q.choices.length){
          const ul = el("div", {style:"margin-top:8px;"});
          q.choices.slice().sort((a,b)=>(a.order_index||0)-(b.order_index||0)).forEach(c => {
            ul.appendChild(el("div", {class:"badge " + (isKnowledge && c.is_correct ? "badge-sage" : "badge-neutral"), style:"display:inline-block; margin:2px 4px 2px 0;"}, [c.label + (isKnowledge && c.is_correct ? " ✓" : "")]));
          });
          row.appendChild(ul);
        }
        qList.appendChild(row);
      });
      paintAddForm(questions.length);
    });
  }

  function paintAddForm(existingCount){
    formArea.innerHTML = "";
    const showFormBtn = el("button", {class:"btn btn-outline"}, ["+ เพิ่มคำถาม"]);
    formArea.appendChild(showFormBtn);

    showFormBtn.addEventListener("click", () => {
      formArea.innerHTML = "";
      formArea.appendChild(buildQuestionForm(quiz, isKnowledge, existingCount, () => { refreshQuestions(); }, () => paintAddForm(existingCount)));
    });
  }
}

function buildQuestionForm(quiz, isKnowledge, orderIndex, onSaved, onCancel){
  const wrap = el("div", {style:"border-top:1px solid var(--line); padding-top:16px;"});
  let kind = isKnowledge ? "single_choice" : "rating";
  let choices = [{label:"", isCorrect:false}, {label:"", isCorrect:false}];

  function paint(){
    wrap.innerHTML = "";

    wrap.appendChild(el("div", {class:"field"}, [
      el("label", {}, ["คำถาม"]),
      el("input", {type:"text", id:"q-prompt"}),
    ]));

    const row = el("div", {class:"field-row field-row-2"});
    const kindSelect = el("select", {id:"q-kind"});
    if(isKnowledge){
      kindSelect.appendChild(el("option", {value:"single_choice"}, ["เลือกตอบข้อเดียว"]));
      kindSelect.appendChild(el("option", {value:"multiple_choice"}, ["เลือกตอบได้หลายข้อ"]));
    } else {
      kindSelect.appendChild(el("option", {value:"rating"}, ["ให้คะแนน 1-5"]));
      kindSelect.appendChild(el("option", {value:"text"}, ["ตอบแบบข้อความ"]));
      kindSelect.appendChild(el("option", {value:"single_choice"}, ["เลือกตอบข้อเดียว"]));
    }
    kindSelect.value = kind;
    kindSelect.addEventListener("change", () => { kind = kindSelect.value; choices.forEach(c => c.isCorrect = false); paint(); });
    row.appendChild(el("div", {class:"field"}, [el("label",{},["ประเภทคำถาม"]), kindSelect]));

    if(isKnowledge){
      row.appendChild(el("div", {class:"field"}, [
        el("label", {}, ["คะแนนของข้อนี้"]),
        el("input", {type:"number", id:"q-points", min:"1", value:"1"}),
      ]));
    }
    wrap.appendChild(row);

    if(kind === "single_choice" || kind === "multiple_choice"){
      const choiceField = el("div", {class:"field"});
      choiceField.appendChild(el("label", {}, [`ตัวเลือก ${isKnowledge ? "(เลือกเฉลยที่ถูกต้อง)" : ""}`]));
      const choiceRows = el("div", {});
      choices.forEach((c, idx) => {
        const cRow = el("div", {style:"display:flex; align-items:center; gap:8px; margin-bottom:8px;"});
        if(isKnowledge){
          const correctInput = el("input", {type: kind === "single_choice" ? "radio" : "checkbox", name:"correct-choice", style:"width:18px; height:18px; accent-color:var(--sage); flex-shrink:0;"});
          correctInput.checked = c.isCorrect;
          correctInput.addEventListener("change", () => {
            if(kind === "single_choice"){
              choices.forEach(x => x.isCorrect = false);
              c.isCorrect = true;
            } else {
              c.isCorrect = correctInput.checked;
            }
          });
          cRow.appendChild(correctInput);
        }
        const labelInput = el("input", {type:"text", placeholder:`ตัวเลือกที่ ${idx+1}`, style:"flex:1; min-width:0;"});
        labelInput.value = c.label;
        labelInput.addEventListener("input", () => { c.label = labelInput.value; });
        cRow.appendChild(labelInput);
        if(choices.length > 2){
          const rmBtn = el("button", {class:"btn-danger-text", type:"button"}, ["ลบ"]);
          rmBtn.addEventListener("click", () => { choices.splice(idx,1); paint(); });
          cRow.appendChild(rmBtn);
        }
        choiceRows.appendChild(cRow);
      });
      choiceField.appendChild(choiceRows);
      const addChoiceBtn = el("a", {href:"#", style:"font-size:13px; font-weight:600; color:var(--ink); text-decoration:none;"}, ["+ เพิ่มตัวเลือก"]);
      addChoiceBtn.addEventListener("click", (e) => { e.preventDefault(); choices.push({label:"", isCorrect:false}); paint(); });
      choiceField.appendChild(addChoiceBtn);
      wrap.appendChild(choiceField);
    }

    const errBox = el("div", {class:"alert alert-error hidden"});
    wrap.appendChild(errBox);

    const btnRow = el("div", {style:"display:flex; gap:12px; flex-wrap:wrap;"});
    const saveBtn = el("button", {class:"btn btn-primary"}, ["บันทึกคำถาม"]);
    saveBtn.addEventListener("click", handleSave);
    btnRow.appendChild(saveBtn);
    const cancelBtn = el("button", {class:"btn-ghost", style:"background:none; border:none; cursor:pointer; padding:11px 8px; font-size:14px; font-weight:500; color:var(--ink-light);"}, ["ยกเลิก"]);
    cancelBtn.addEventListener("click", () => onCancel());
    btnRow.appendChild(cancelBtn);
    wrap.appendChild(btnRow);

    async function handleSave(){
      const prompt = $("#q-prompt", wrap).value.trim();
      errBox.classList.add("hidden");
      if(!prompt){ errBox.textContent = "กรุณากรอกคำถาม"; errBox.classList.remove("hidden"); return; }

      const needsChoices = kind === "single_choice" || kind === "multiple_choice";
      const filtered = choices.filter(c => c.label.trim().length > 0);
      if(needsChoices && filtered.length < 2){ errBox.textContent = "ต้องมีตัวเลือกอย่างน้อย 2 ข้อ"; errBox.classList.remove("hidden"); return; }
      if(isKnowledge && needsChoices && !filtered.some(c => c.isCorrect)){ errBox.textContent = "กรุณาเลือกเฉลยที่ถูกต้องอย่างน้อย 1 ข้อ"; errBox.classList.remove("hidden"); return; }

      const points = isKnowledge ? (Number($("#q-points", wrap).value) || 1) : 1;
      const choicesPayload = needsChoices ? filtered.map((c, idx) => ({ id: "c"+idx+"_"+Date.now(), label:c.label, is_correct: !!c.isCorrect, order_index: idx })) : [];

      saveBtn.disabled = true;
      try{
        await db.collection(COL.questions).add({
          quiz_id: quiz.id, kind, prompt, points, order_index: orderIndex,
          choices: choicesPayload,
        });
        onSaved();
      }catch(err){
        errBox.textContent = err.message || "เกิดข้อผิดพลาด";
        errBox.classList.remove("hidden");
        saveBtn.disabled = false;
      }
    }
  }

  paint();
  return wrap;
}
</script>

<script>
/* ============================================================
   ADMIN: RESULTS DASHBOARD (overview + drill-down + CSV export)
   ============================================================ */
function renderAdminResults(){
  const container = el("div", {});
  const crumb = adminBreadcrumb("ผลคะแนน — ภาพรวมทุกคน");
  container.appendChild(crumb);

  const body = el("div", {id:"results-body"}, [loadingBox()]);
  container.appendChild(body);

  loadResults();
  return container;

  async function loadResults(){
    const [doctorsSnap, attemptsSnap, coursesSnap] = await Promise.all([
      db.collection(COL.profiles).where("role","==","doctor").get(),
      db.collection(COL.attempts).get(),
      db.collection(COL.courses).where("is_published","==",true).get(),
    ]);
    const doctors = doctorsSnap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.full_name||"").localeCompare(b.full_name||""));
    const attempts = attemptsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    const knowledgeAttempts = attempts.filter(a => a.passed !== null && a.passed !== undefined);

    function statsFor(doctorId){
      const mine = knowledgeAttempts.filter(a => a.user_id === doctorId);
      const passed = mine.filter(a => a.passed === true).length;
      const failed = mine.filter(a => a.passed === false).length;
      const avg = mine.length > 0 ? Math.round(mine.reduce((s,a)=>s+(a.score_percent||0),0)/mine.length) : null;
      return { attempted: mine.length, passed, failed, avg };
    }

    body.innerHTML = "";

    const exportBtn = el("button", {class:"btn btn-outline", style:"margin-bottom:20px;"}, ["Export CSV"]);
    exportBtn.addEventListener("click", () => exportResultsCsv(doctors, statsFor));
    body.appendChild(exportBtn);

    const statGrid = el("div", {class:"stat-grid stat-grid-4"});
    statGrid.appendChild(el("div", {class:"stat-box"}, [el("div",{class:"val"},[String(doctors.length)]), el("div",{class:"lbl"},["แพทย์ทั้งหมด"])]));
    statGrid.appendChild(el("div", {class:"stat-box"}, [el("div",{class:"val"},[String(coursesSnap.size)]), el("div",{class:"lbl"},["คอร์สที่เผยแพร่"])]));
    statGrid.appendChild(el("div", {class:"stat-box"}, [el("div",{class:"val", style:"color:var(--sage);"},[String(knowledgeAttempts.filter(a=>a.passed).length)]), el("div",{class:"lbl"},["ผ่านเกณฑ์ (รวม)"])]));
    statGrid.appendChild(el("div", {class:"stat-box"}, [el("div",{class:"val", style:"color:var(--rust);"},[String(knowledgeAttempts.filter(a=>a.passed===false).length)]), el("div",{class:"lbl"},["ไม่ผ่านเกณฑ์ (รวม)"])]));
    body.appendChild(statGrid);

    if(doctors.length === 0){
      body.appendChild(el("div", {class:"card", style:"text-align:center;"}, [el("p",{class:"muted"},["ยังไม่มีแพทย์ในระบบ"])]));
      return;
    }

    if(window.innerWidth < 640){
      doctors.forEach(d => {
        const s = statsFor(d.id);
        const card = el("a", {href:"#", class:"card card-link", style:"text-decoration:none; display:block;", onClick:(e)=>{e.preventDefault(); state.route=`admin:doctor:${d.id}`; render();}});
        const top = el("div", {style:"display:flex; justify-content:space-between; margin-bottom:6px;"});
        top.appendChild(el("p", {style:"font-weight:600;"}, [d.full_name]));
        if(s.avg !== null){
          top.appendChild(el("span", {class:"badge " + (s.passed===0 && s.failed>0 ? "badge-rust" : "badge-sage")}, [`เฉลี่ย ${s.avg}%`]));
        }
        card.appendChild(top);
        card.appendChild(el("p", {class:"muted", style:"font-size:13px;"}, [`ทำแล้ว ${s.attempted} ครั้ง · ผ่าน ${s.passed} · ไม่ผ่าน ${s.failed}`]));
        body.appendChild(card);
      });
    } else {
      const wrap = el("div", {class:"table-wrap"});
      const table = el("table", {class:"simple-table"});
      table.appendChild(el("thead", {}, [el("tr", {}, [
        el("th",{},["แพทย์"]), el("th",{},["ทำแล้ว"]), el("th",{},["ผ่าน"]), el("th",{},["ไม่ผ่าน"]), el("th",{},["คะแนนเฉลี่ย"])
      ])]));
      const tbody = el("tbody", {});
      doctors.forEach(d => {
        const s = statsFor(d.id);
        const tr = el("tr", {});
        const nameLink = el("a", {href:"#", style:"font-weight:600; color:var(--ink); text-decoration:none;", onClick:(e)=>{e.preventDefault(); state.route=`admin:doctor:${d.id}`; render();}}, [d.full_name]);
        tr.appendChild(el("td", {}, [nameLink]));
        tr.appendChild(el("td", {class:"muted"}, [String(s.attempted)]));
        tr.appendChild(el("td", {style:"color:var(--sage); font-weight:600;"}, [String(s.passed)]));
        tr.appendChild(el("td", {style:"color:var(--rust); font-weight:600;"}, [String(s.failed)]));
        tr.appendChild(el("td", {style:"font-weight:600;"}, [s.avg!==null ? `${s.avg}%` : "-"]));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      body.appendChild(wrap);
    }
  }
}

function exportResultsCsv(doctors, statsFor){
  const headers = ["name","department","attempted","passed","failed","avgScore"];
  const rows = doctors.map(d => {
    const s = statsFor(d.id);
    return [d.full_name, d.department || "-", s.attempted, s.passed, s.failed, s.avg !== null ? s.avg : "-"];
  });
  const csvLines = [headers.join(","), ...rows.map(r => r.map(v => {
    const s = String(v);
    return s.includes(",") ? `"${s}"` : s;
  }).join(","))];
  const csvContent = "\uFEFF" + csvLines.join("\n");
  const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "training_results_overview.csv";
  link.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   ADMIN: PER-DOCTOR DRILL-DOWN
   ============================================================ */
function renderAdminDoctorDetail(doctorId){
  const container = el("div", {});
  const body = el("div", {id:"doctor-detail-body"}, [loadingBox()]);

  db.collection(COL.profiles).doc(doctorId).get().then(async (snap) => {
    const doctor = snap.data();
    container.innerHTML = "";
    container.appendChild(adminBreadcrumb(doctor.full_name, "admin:results"));
    container.appendChild(el("p", {class:"muted", style:"margin-bottom:24px; margin-top:-16px;"}, [
      [doctor.department, doctor.specialty].filter(Boolean).join(" · ") || ROLE_LABEL[doctor.role] || ""
    ]));
    container.appendChild(body);

    const attemptsSnap = await db.collection(COL.attempts).where("user_id","==",doctorId).get();
    const attempts = attemptsSnap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(b.submitted_at_ms||0)-(a.submitted_at_ms||0));

    if(attempts.length === 0){
      body.innerHTML = "";
      body.appendChild(el("div", {class:"card", style:"text-align:center;"}, [el("p",{class:"muted"},["ยังไม่มีการทำแบบทดสอบ"])]));
      return;
    }

    const quizIds = [...new Set(attempts.map(a => a.quiz_id))];
    const courseIds = [...new Set(attempts.map(a => a.course_id).filter(Boolean))];

    const quizzesMap = {}, coursesMap = {};
    await Promise.all(quizIds.map(async id => {
      const d = await db.collection(COL.quizzes).doc(id).get();
      if(d.exists) quizzesMap[id] = d.data();
    }));
    await Promise.all(courseIds.map(async id => {
      const d = await db.collection(COL.courses).doc(id).get();
      if(d.exists) coursesMap[id] = d.data();
    }));

    body.innerHTML = "";
    attempts.forEach(a => {
      const quiz = quizzesMap[a.quiz_id] || {};
      const course = coursesMap[a.course_id] || {};
      const row = el("div", {class:"card", style:"display:flex; flex-direction:column; gap:8px;"});
      if(window.innerWidth >= 640){ row.style.flexDirection = "row"; row.style.justifyContent = "space-between"; row.style.alignItems = "center"; }

      const left = el("div", {});
      left.appendChild(el("p", {style:"font-weight:600; font-size:14px;"}, [course.title || "ไม่พบคอร์ส"]));
      left.appendChild(el("p", {class:"muted", style:"font-size:13px;"}, [`${quiz.title || ""} · ${a.submitted_at_ms ? fmtDateTime(a.submitted_at_ms) : ""}`]));
      row.appendChild(left);

      if(a.score_percent !== null && a.score_percent !== undefined){
        row.appendChild(el("span", {class:"badge " + (a.passed ? "badge-sage" : "badge-rust")}, [`${a.score_percent}% · ${a.passed ? "ผ่าน" : "ไม่ผ่าน"}`]));
      } else {
        row.appendChild(el("span", {class:"badge badge-neutral"}, ["แบบประเมิน"]));
      }
      body.appendChild(row);
    });
  });

  return container;
}
