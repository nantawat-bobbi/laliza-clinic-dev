<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>MedTrain — ระบบเทรนนิ่งและวันลา</title>

<!-- Firebase compat SDKs (no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --ink:#1B3A3A; --ink-light:#2C5454;
  --porcelain:#F7F5F0; --paper:#FFFFFF; --line:#E2DDD2;
  --clay:#C77B4A; --clay-light:#F0DCC9;
  --sage:#6E8F71; --sage-light:#E3EBE0;
  --rust:#B5503C; --rust-light:#F5DDD6;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--porcelain); color:#1B2421;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;
}
h1,h2,h3{ font-family:Georgia,"Times New Roman",serif; color:var(--ink); margin:0; }
input,select,textarea,button{ font-size:16px; font-family:inherit; }
@media(min-width:640px){ input,select,textarea,button{ font-size:0.875rem; } }
a{ color:inherit; }
.hidden{ display:none !important; }

/* Layout */
.app-header{ position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); }
.header-inner{ max-width:960px; margin:0 auto; padding:0 16px; }
.header-top{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; gap:8px; }
.brand{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.brand h1{ font-size:18px; font-weight:600; white-space:nowrap; }
.role-pill{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; color:var(--ink-light); display:none; }
@media(min-width:640px){ .role-pill{ display:inline; } .brand h1{ font-size:20px; } }
.header-right{ display:flex; align-items:center; gap:8px; min-width:0; }
.user-name{ font-size:13px; color:var(--ink-light); max-width:7rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media(min-width:640px){ .user-name{ font-size:14px; max-width:none; } }
.signout-btn{ background:none; border:none; color:var(--ink-light); font-size:13px; cursor:pointer; padding:6px; }
.signout-btn:hover{ color:var(--rust); }
.tabs{ display:flex; gap:16px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none; margin-bottom:-1px; }
.tabs::-webkit-scrollbar{ display:none; }
.tab-btn{ background:none; border:none; border-bottom:2px solid transparent; color:var(--ink-light); font-size:14px; font-weight:500; padding:4px 2px 10px; cursor:pointer; white-space:nowrap; position:relative; }
.tab-btn.active{ border-bottom-color:var(--ink); color:var(--ink); }
.tab-btn.active::before{ content:""; position:absolute; left:0; top:-1px; width:3px; height:calc(100% + 1px); background:var(--clay); }

.main{ max-width:960px; margin:0 auto; padding:24px 16px; }
@media(min-width:640px){ .main{ padding:32px 24px; } }

.eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--ink-light); margin-bottom:4px; }
.page-title{ font-size:22px; font-weight:600; margin-bottom:24px; }

.card{ background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:20px; margin-bottom:16px; }
@media(min-width:640px){ .card{ padding:24px; } }
.card-link{ display:block; text-decoration:none; transition:border-color .15s; }
.card-link:hover{ border-color:var(--ink); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:4px; font-weight:600; font-size:14px; padding:11px 20px; cursor:pointer; border:1px solid transparent; transition:.15s; min-height:44px; }
.btn-primary{ background:var(--ink); color:white; }
.btn-primary:hover{ background:var(--ink-light); }
.btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
.btn-outline{ background:transparent; border-color:var(--ink); color:var(--ink); }
.btn-outline:hover{ background:var(--ink); color:white; }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-light); }
.btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }
.btn-danger-text{ background:none; border:none; color:var(--rust); font-size:13px; font-weight:600; cursor:pointer; padding:8px; }
.btn-block{ width:100%; }
@media(min-width:640px){ .btn-block-mobile-only{ width:auto; } }

.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:4px; padding:10px 12px; background:white;
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(27,58,58,.1); }
.field-row{ display:grid; grid-template-columns:1fr; gap:16px; }
@media(min-width:640px){ .field-row-2{ grid-template-columns:1fr 1fr; } }

.alert{ border-radius:4px; padding:10px 14px; font-size:14px; margin-bottom:16px; }
.alert-error{ background:var(--rust-light); border:1px solid rgba(181,80,60,.3); color:var(--rust); }
.alert-success{ background:var(--sage-light); border:1px solid rgba(110,143,113,.3); color:var(--sage); }

.badge{ font-size:12px; padding:2px 8px; border-radius:4px; font-weight:600; white-space:nowrap; }
.badge-sage{ background:var(--sage-light); color:var(--sage); }
.badge-rust{ background:var(--rust-light); color:var(--rust); }
.badge-neutral{ background:var(--line); color:var(--ink-light); }

.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
@media(min-width:640px){ .stat-grid-3{ grid-template-columns:1fr 1fr 1fr; } .stat-grid-4{ grid-template-columns:1fr 1fr 1fr 1fr; } }
.stat-box{ border:1px solid var(--line); border-radius:4px; padding:16px; background:var(--paper); }
.stat-box .val{ font-size:24px; font-weight:600; font-family:Georgia,serif; color:var(--ink); }
.stat-box .lbl{ font-size:12px; color:var(--ink-light); margin-top:4px; }

.section-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
@media(min-width:768px){ .section-grid-2{ grid-template-columns:1fr 1fr; } }

.choice-row{ display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:4px; padding:12px 16px; font-size:14px; cursor:pointer; min-height:44px; margin-bottom:8px; transition:.15s; }
.choice-row:hover{ border-color:var(--ink); }
.choice-row input[type=radio], .choice-row input[type=checkbox]{ width:18px; height:18px; accent-color:var(--ink); flex-shrink:0; }

.rating-row{ display:flex; gap:8px; flex-wrap:wrap; }
.rating-btn{ width:44px; height:44px; border-radius:4px; border:1px solid var(--line); background:white; font-weight:600; font-size:14px; color:var(--ink-light); cursor:pointer; }
.rating-btn.selected{ background:var(--ink); color:white; border-color:var(--ink); }

table.simple-table{ width:100%; font-size:14px; border-collapse:collapse; }
table.simple-table th{ text-align:left; padding:12px 16px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink-light); border-bottom:1px solid var(--line); }
table.simple-table td{ padding:12px 16px; border-bottom:1px solid var(--line); }
table.simple-table tr:last-child td{ border-bottom:none; }
.table-wrap{ background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
.mobile-only{ display:block; } .desktop-only{ display:none; }
@media(min-width:640px){ .mobile-only{ display:none; } .desktop-only{ display:block; } }

.spinner{ display:inline-block; width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-box{ width:100%; max-width:400px; padding:16px; }
.login-card{ background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:32px; }
.muted{ color:var(--ink-light); font-size:13px; }
.divider{ border-top:1px solid var(--line); margin:16px 0; }
.q-number{ color:var(--clay); margin-right:6px; }
.profile-avatar{ width:72px; height:72px; border-radius:50%; background:var(--clay-light); color:var(--clay); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:600; font-family:Georgia,serif; flex-shrink:0; overflow:hidden; }
.profile-avatar img{ width:100%; height:100%; object-fit:cover; }
.video-embed{ position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:4px; overflow:hidden; margin-bottom:16px; }
.video-embed iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>

<div id="root"></div>

<script>
/* ============================================================
   FIREBASE CONFIG — โปรเจกต์แยกเฉพาะของ MedTrain (lalizaclinic-medtrain)
   ไม่แชร์กับระบบตารางงานเดิม (lalizaclinic-work-schedule) อีกต่อไป
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCZg5LhnPTiWOYLU-r0pYvSCIx__APCTFk",
  authDomain: "lalizaclinic-medtrain.firebaseapp.com",
  projectId: "lalizaclinic-medtrain",
  storageBucket: "lalizaclinic-medtrain.firebasestorage.app",
  messagingSenderId: "947473223639",
  appId: "1:947473223639:web:345a57c8295ad987784592"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* Secondary Firebase app instance — used ONLY when an Admin creates a new account.
   This lets us call createUserWithEmailAndPassword without signing the Admin out of
   their own session on the primary `auth` instance above. */
const secondaryApp = firebase.initializeApp(firebaseConfig, "secondary");
const secondaryAuth = secondaryApp.auth();
secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);

/* ============================================================
   LEGACY PROJECT CONNECTION — read-only link to the existing
   work-schedule system (lalizaclinic-work-schedule), used only to
   pull the doctor name list into the "create user" form so Admin
   doesn't have to retype names that already exist there.
   We only ever call .get() on the `doctors` collection — never write.
   ============================================================ */
const legacyFirebaseConfig = {
  apiKey: "AIzaSyC0P1LGtglA_t1Nc5PyM5uD3MOLnfBZwFM",
  authDomain: "lalizaclinic-work-schedule.firebaseapp.com",
  projectId: "lalizaclinic-work-schedule",
  storageBucket: "lalizaclinic-work-schedule.firebasestorage.app",
  messagingSenderId: "1052920426382",
  appId: "1:1052920426382:web:e07f91f2e56d0fc7497edf"
};
const legacyApp = firebase.initializeApp(legacyFirebaseConfig, "legacy");
const legacyDb = legacyApp.firestore();

/* Collection names — this project (lalizaclinic-medtrain) is dedicated to MedTrain only,
   no other app shares it, but we keep the medtrain_ prefix for clarity. */
const COL = {
  profiles: "medtrain_profiles",
  loginDirectory: "medtrain_login_directory", // public-readable: uid, full_name, photo_url, role, is_active only
  leaveLink: "medtrain_leave_link",
  courses: "medtrain_courses",
  quizzes: "medtrain_quizzes",
  questions: "medtrain_questions",
  attempts: "medtrain_attempts",
};

function randomToken(len){
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let out = "";
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function randomPin(){
  return String(Math.floor(100000 + Math.random()*900000)); // 6-digit, no leading zero issue
}

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const state = {
  user: null,        // firebase auth user
  profile: null,      // medtrain_profiles doc
  route: "dashboard", // dashboard | leave | training | admin | profile
  loading: true,
};

function $(sel, parent){ return (parent||document).querySelector(sel); }
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v === null || v === undefined || v === false) continue; // skip falsy attrs entirely
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  (children||[]).forEach(c => { if(c !== null && c !== undefined && c !== false) e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c); });
  return e;
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}
function fmtDate(d){
  try{ return new Date(d).toLocaleDateString("th-TH", {year:"numeric", month:"short", day:"numeric"}); }
  catch(e){ return ""; }
}
function fmtDateTime(d){
  try{ return new Date(d).toLocaleString("th-TH", {dateStyle:"medium", timeStyle:"short"}); }
  catch(e){ return ""; }
}

const ROLE_LABEL = { doctor: "แพทย์", staff: "พนักงาน", admin: "ผู้ดูแลระบบ" };

const root = document.getElementById("root");

/* ============================================================
   AUTH STATE LISTENER
   ============================================================ */
auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if(user){
    try{
      const snap = await db.collection(COL.profiles).doc(user.uid).get();
      state.profile = snap.exists ? snap.data() : null;
    }catch(e){
      console.error("Failed to load profile", e);
      state.profile = null;
    }
  } else {
    state.profile = null;
  }
  state.loading = false;
  render();
});

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  root.innerHTML = "";
  if(state.loading){
    root.appendChild(el("div", {class:"center-screen"}, [el("div", {class:"spinner"})]));
    return;
  }
  if(!state.user || !state.profile){
    root.appendChild(renderLogin());
    return;
  }
  root.appendChild(renderApp());
}

render();
</script>

<!-- The rest of the application logic is appended in subsequent script blocks for maintainability -->
<script>
/* ============================================================
   LOGIN VIEW — pick your name from a list, then enter PIN
   ============================================================ */
function renderLogin(){
  const wrap = el("div", {class:"center-screen"});
  const box = el("div", {class:"login-box", style:"max-width:440px;"});
  wrap.appendChild(box);

  let selectedEntry = null; // { uid, full_name, role, photo_url, isFirstTime, legacyDoctorId }

  function header(){
    return el("div", {style:"margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:16px; display:flex; justify-content:space-between; align-items:flex-end;"}, [
      el("div", {}, [
        el("div", {class:"eyebrow"}, ["ระบบภายในคลินิก"]),
        el("h1", {style:"font-size:28px;"}, ["MedTrain"]),
      ]),
      el("span", {class:"muted"}, ["เทรนนิ่ง · วันลา"]),
    ]);
  }

  async function loadCombinedDirectory(){
    // 1. MedTrain-native users (staff/admin created by Admin, or doctors who already
    //    completed first-time PIN setup — their entry carries legacy_doctor_id so we
    //    can recognize them next time and not show them as "first time" again).
    const nativeSnap = await db.collection(COL.loginDirectory).get();
    const native = nativeSnap.docs.map(d => ({ uid: d.id, ...d.data(), isFirstTime: false }));
    const onboardedLegacyIds = new Set(
      native.map(u => u.legacy_doctor_id).filter(Boolean)
    );

    // 2. Doctors from the legacy work-schedule project who have NOT yet been
    //    onboarded into MedTrain (no native entry references their legacy doc id).
    let legacyDoctors = [];
    try{
      const legacySnap = await legacyDb.collection("doctors").get();
      legacyDoctors = legacySnap.docs
        .filter(d => !onboardedLegacyIds.has(d.id))
        .map(d => ({ uid: null, legacyDoctorId: d.id, full_name: d.data().name, role: "doctor", photo_url: "", isFirstTime: true }))
        .filter(u => u.full_name);
    }catch(err){
      console.error("Failed to load legacy doctors list", err);
      // Non-fatal — native directory still works even if the legacy project is unreachable.
    }

    return [...native, ...legacyDoctors]
      .filter(u => u.is_active !== false)
      .sort((a,b) => (a.full_name||"").localeCompare(b.full_name||""));
  }

  function paintPicker(){
    box.innerHTML = "";
    box.appendChild(header());

    const card = el("div", {class:"login-card"});
    card.appendChild(el("h2", {style:"font-size:20px; margin-bottom:4px;"}, ["เข้าสู่ระบบ"]));
    card.appendChild(el("p", {class:"muted", style:"margin-bottom:20px;"}, ["เลือกชื่อของคุณจากรายชื่อด้านล่าง"]));

    const listBox = el("div", {id:"login-directory-list"}, [el("div", {class:"spinner"})]);
    card.appendChild(listBox);
    box.appendChild(card);

    loadCombinedDirectory().then(directory => {
      listBox.innerHTML = "";
      if(directory.length === 0){
        listBox.appendChild(el("p", {class:"muted"}, ["ยังไม่มีผู้ใช้งานในระบบ — กรุณาติดต่อผู้ดูแลระบบ"]));
        return;
      }
      directory.forEach(u => {
        const row = el("button", {type:"button", style:"display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:1px solid var(--line); border-radius:4px; padding:10px 14px; margin-bottom:8px; cursor:pointer; min-height:56px;"});
        const avatar = el("div", {class:"profile-avatar", style:"width:40px; height:40px; font-size:16px;"});
        if(u.photo_url){ avatar.appendChild(el("img", {src:u.photo_url, alt:""})); }
        else { avatar.textContent = (u.full_name||"?").trim().charAt(0).toUpperCase(); }
        row.appendChild(avatar);
        row.appendChild(el("div", {}, [
          el("p", {style:"font-weight:600; font-size:14px;"}, [u.full_name]),
          el("p", {class:"muted", style:"font-size:12px;"}, [ROLE_LABEL[u.role] || u.role]),
        ]));
        row.addEventListener("click", () => {
          selectedEntry = u;
          if(u.isFirstTime){ paintSetupPin(); } else { paintPin(); }
        });
        listBox.appendChild(row);
      });
    }).catch(err => {
      listBox.innerHTML = "";
      listBox.appendChild(el("div", {class:"alert alert-error"}, [err.message || "โหลดรายชื่อไม่สำเร็จ"]));
    });
  }

  function entryHeadRow(){
    const headRow = el("div", {style:"display:flex; align-items:center; gap:12px; margin:16px 0;"});
    const avatar = el("div", {class:"profile-avatar"});
    if(selectedEntry.photo_url){ avatar.appendChild(el("img", {src:selectedEntry.photo_url, alt:""})); }
    else { avatar.textContent = (selectedEntry.full_name||"?").trim().charAt(0).toUpperCase(); }
    headRow.appendChild(avatar);
    headRow.appendChild(el("div", {}, [
      el("p", {style:"font-weight:600; font-size:16px;"}, [selectedEntry.full_name]),
      el("p", {class:"muted"}, [ROLE_LABEL[selectedEntry.role] || selectedEntry.role]),
    ]));
    return headRow;
  }

  function paintPin(){
    box.innerHTML = "";
    box.appendChild(header());

    const card = el("div", {class:"login-card"});
    const backLink = el("a", {href:"#", class:"muted", style:"text-decoration:none; font-size:13px;"}, ["← เลือกคนอื่น"]);
    backLink.addEventListener("click", (e) => { e.preventDefault(); selectedEntry = null; paintPicker(); });
    card.appendChild(backLink);
    card.appendChild(entryHeadRow());

    const errorBox = el("div", {class:"alert alert-error hidden"});
    card.appendChild(errorBox);

    card.appendChild(el("div", {class:"field"}, [
      el("label", {}, ["PIN 6 หลัก"]),
      el("input", {type:"tel", inputmode:"numeric", pattern:"[0-9]*", maxlength:"6", id:"f-pin", placeholder:"••••••", style:"font-size:24px; letter-spacing:0.3em; text-align:center;", autofocus:"true"}),
    ]));

    const submitBtn = el("button", {class:"btn btn-primary btn-block"}, ["เข้าสู่ระบบ"]);
    submitBtn.addEventListener("click", handleSubmit);
    card.appendChild(submitBtn);
    box.appendChild(card);
    box.appendChild(el("p", {class:"muted", style:"text-align:center; margin-top:16px;"}, [
      "ลืม PIN? ติดต่อผู้ดูแลระบบเพื่อรีเซ็ต"
    ]));

    const pinInput = $("#f-pin", card);
    pinInput.focus();
    pinInput.addEventListener("keydown", (e) => { if(e.key === "Enter") handleSubmit(); });

    async function handleSubmit(){
      const pin = pinInput.value.trim();
      errorBox.classList.add("hidden");

      if(!/^[0-9]{6}$/.test(pin)){
        errorBox.textContent = "กรุณากรอก PIN ให้ครบ 6 หลัก";
        errorBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังเข้าสู่ระบบ...";

      try{
        const loginEmail = selectedEntry.auth_email || `${selectedEntry.uid}@medtrain.local`;
        await auth.signInWithEmailAndPassword(loginEmail, pin);
        // onAuthStateChanged picks up the rest
      }catch(err){
        errorBox.textContent = friendlyAuthError(err);
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "เข้าสู่ระบบ";
      }
    }
  }

  /* First-time setup for a doctor pulled from the legacy `doctors` collection:
     they pick their own PIN (no admin involved), we create their MedTrain auth
     account + profile + directory entry right here, then sign them in. */
  function paintSetupPin(){
    box.innerHTML = "";
    box.appendChild(header());

    const card = el("div", {class:"login-card"});
    const backLink = el("a", {href:"#", class:"muted", style:"text-decoration:none; font-size:13px;"}, ["← เลือกคนอื่น"]);
    backLink.addEventListener("click", (e) => { e.preventDefault(); selectedEntry = null; paintPicker(); });
    card.appendChild(backLink);
    card.appendChild(entryHeadRow());

    card.appendChild(el("p", {class:"muted", style:"margin-bottom:16px;"}, [
      "เข้าใช้งานครั้งแรก — กรุณาตั้ง PIN 6 หลักของคุณเอง เพื่อใช้เข้าสู่ระบบครั้งต่อไป"
    ]));

    const errorBox = el("div", {class:"alert alert-error hidden"});
    card.appendChild(errorBox);

    card.appendChild(el("div", {class:"field"}, [
      el("label", {}, ["ตั้ง PIN 6 หลัก"]),
      el("input", {type:"tel", inputmode:"numeric", pattern:"[0-9]*", maxlength:"6", id:"f-new-pin", placeholder:"••••••", style:"font-size:24px; letter-spacing:0.3em; text-align:center;", autofocus:"true"}),
    ]));
    card.appendChild(el("div", {class:"field"}, [
      el("label", {}, ["ยืนยัน PIN อีกครั้ง"]),
      el("input", {type:"tel", inputmode:"numeric", pattern:"[0-9]*", maxlength:"6", id:"f-confirm-pin", placeholder:"••••••", style:"font-size:24px; letter-spacing:0.3em; text-align:center;"}),
    ]));

    const submitBtn = el("button", {class:"btn btn-primary btn-block"}, ["ตั้ง PIN และเข้าสู่ระบบ"]);
    submitBtn.addEventListener("click", handleSetup);
    card.appendChild(submitBtn);
    box.appendChild(card);

    async function handleSetup(){
      const pin = $("#f-new-pin", card).value.trim();
      const confirmPin = $("#f-confirm-pin", card).value.trim();
      errorBox.classList.add("hidden");

      if(!/^[0-9]{6}$/.test(pin)){
        errorBox.textContent = "PIN ต้องเป็นตัวเลข 6 หลัก";
        errorBox.classList.remove("hidden");
        return;
      }
      if(pin !== confirmPin){
        errorBox.textContent = "PIN ทั้งสองช่องไม่ตรงกัน";
        errorBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังตั้งค่า...";

      try{
        const placeholderEmail = `tmp_${randomToken(12)}@medtrain.local`;

        // Create the auth account on the SECONDARY instance (keeps this flow isolated).
        // NOTE: we deliberately do NOT rename this email afterward — Firebase requires
        // verifying a new email address before allowing updateEmail(), and these
        // synthetic "@medtrain.local" addresses can never be verified since there's no
        // real mailbox. So the placeholder email IS the permanent login email; we store
        // it in Firestore (auth_email) so future logins know which email to pair with the PIN.
        const cred = await secondaryAuth.createUserWithEmailAndPassword(placeholderEmail, pin);
        const realUid = cred.user.uid;
        await secondaryAuth.signOut();

        await db.collection(COL.profiles).doc(realUid).set({
          full_name: selectedEntry.full_name,
          role: "doctor",
          is_active: true,
          legacy_doctor_id: selectedEntry.legacyDoctorId,
          auth_email: placeholderEmail,
          phone: "", department: "", specialty: "", photo_url: "",
          created_at: firebase.firestore.FieldValue.serverTimestamp(),
        });
        await db.collection(COL.loginDirectory).doc(realUid).set({
          full_name: selectedEntry.full_name, role: "doctor", is_active: true, photo_url: "",
          legacy_doctor_id: selectedEntry.legacyDoctorId,
          auth_email: placeholderEmail,
        });

        // Sign in for real on the PRIMARY auth instance using the same placeholder email.
        await auth.signInWithEmailAndPassword(placeholderEmail, pin);
        // onAuthStateChanged picks up the rest
      }catch(err){
        errorBox.textContent = friendlyAuthError(err);
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "ตั้ง PIN และเข้าสู่ระบบ";
      }
    }
  }

  paintPicker();
  return wrap;
}

function friendlyAuthError(err){
  const code = err && err.code;
  if(code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential") return "PIN ไม่ถูกต้อง กรุณาลองใหม่";
  if(code === "auth/too-many-requests") return "ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่";
  return err && err.message ? err.message : "เกิดข้อผิดพลาด กรุณาลองใหม่";
}
</script>

<script>

function renderRoute(){

/* Loading placeholder helper for async sections */
function loadingBox(){
  return el("div", {class:"card", style:"display:flex; justify-content:center; padding:40px;"}, [el("div", {class:"spinner"})]);
}

<script>
/* ============================================================
   TRAINING — course list with embedded video player
   ============================================================ */

/* Convert common share links (YouTube, Google Drive) into embeddable iframe src.
   Falls back to null if the link can't be embedded (then we show an "open link" button instead). */
function toEmbedUrl(url){
  if(!url) return null;
  try{
    // YouTube: watch?v=, youtu.be/, shorts/
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{6,})/);
    if(m) return `https://www.youtube.com/embed/${m[1]}`;

    // Google Drive file: /file/d/<id>/...
    m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
    if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;

    return null;
  }catch(e){ return null; }
}

function renderTrainingRoute(){
  const sub = state.route.split(":");
  if(sub[1] === "quiz" && sub[2]) return renderQuizPage(sub[2]);
  return renderTrainingList();
}

function renderTrainingList(){
  const container = el("div", {});
  container.appendChild(el("div", {style:"margin-bottom:32px;"}, [
    el("div", {class:"eyebrow"}, ["เทรนนิ่ง"]),
    el("h2", {class:"page-title", style:"margin-bottom:0;"}, ["คอร์สเทรนนิ่งสำหรับแพทย์"]),
  ]));

  const listBox = el("div", {id:"training-list"}, [loadingBox()]);
  container.appendChild(listBox);

  loadTrainingData();
  return container;

  async function loadTrainingData(){
    const coursesSnap = await db.collection(COL.courses).where("is_published", "==", true).get();
    const courses = coursesSnap.docs.map(d => ({ id:d.id, ...d.data() }));

    if(courses.length === 0){
      listBox.innerHTML = "";
      listBox.appendChild(el("div", {class:"card", style:"text-align:center;"}, [
        el("p", {class:"muted"}, ["ยังไม่มีคอร์สเทรนนิ่ง — ผู้ดูแลระบบยังไม่ได้เพิ่มข้อมูล"])
      ]));
      return;
    }

    const courseIds = courses.map(c => c.id);
    const quizzes = await getQuizzesForCourses(courseIds);
    const quizIds = quizzes.map(q => q.id);
    const attempts = await getMyAttemptsForQuizzes(quizIds);

    listBox.innerHTML = "";
    courses
      .sort((a,b) => (b.created_at_ms||0) - (a.created_at_ms||0))
      .forEach(course => {
        const courseQuizzes = quizzes.filter(q => q.course_id === course.id);
        const knowledgeQuiz = courseQuizzes.find(q => q.kind === "knowledge");
        const surveyQuiz = courseQuizzes.find(q => q.kind === "survey");
        listBox.appendChild(renderCourseCard(course, knowledgeQuiz, surveyQuiz, attempts));
      });
  }
}

function renderCourseCard(course, knowledgeQuiz, surveyQuiz, attempts){
  const card = el("div", {class:"card"});

  const headerRow = el("div", {style:"display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"});
  headerRow.appendChild(el("h3", {style:"font-size:17px;"}, [course.title]));
  if(course.due_date){
    headerRow.appendChild(el("span", {class:"eyebrow"}, [`กำหนด: ${fmtDate(course.due_date)}`]));
  }
  card.appendChild(headerRow);

  if(course.description){
    card.appendChild(el("p", {class:"muted", style:"margin-bottom:12px;"}, [course.description]));
  }

  // Inline video embed — primary feature
  const embedUrl = toEmbedUrl(course.link_url);
  if(embedUrl){
    card.appendChild(el("div", {class:"video-embed"}, [
      el("iframe", {src:embedUrl, allow:"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture", allowfullscreen:"true"})
    ]));
  } else if(course.link_url){
    card.appendChild(el("a", {href:course.link_url, target:"_blank", rel:"noopener noreferrer", style:"display:inline-flex; gap:6px; font-weight:600; color:var(--ink); text-decoration:none; margin-bottom:12px;"}, ["ดูเนื้อหาคอร์ส ↗"]));
  }

  const actionsRow = el("div", {style:"display:flex; flex-direction:column; gap:12px; padding-top:12px; border-top:1px solid var(--line);"});
  if(window.innerWidth >= 640){ actionsRow.style.flexDirection = "row"; actionsRow.style.flexWrap = "wrap"; }

  if(knowledgeQuiz){
    const myAttempt = latestAttemptFor(attempts, knowledgeQuiz.id);
    const btn = el("a", {href:"#", class:"btn btn-outline", onClick:(e)=>{ e.preventDefault(); state.route = `training:quiz:${knowledgeQuiz.id}`; render(); }}, ["แบบทดสอบความรู้"]);
    if(myAttempt){
      btn.appendChild(el("span", {class:"badge " + (myAttempt.passed ? "badge-sage" : "badge-rust")}, [`${myAttempt.score_percent}% · ${myAttempt.passed ? "ผ่าน" : "ไม่ผ่าน"}`]));
    }
    actionsRow.appendChild(btn);
  }
  if(surveyQuiz){
    const myAttempt = latestAttemptFor(attempts, surveyQuiz.id);
    const btn = el("a", {href:"#", class:"btn btn-ghost", onClick:(e)=>{ e.preventDefault(); state.route = `training:quiz:${surveyQuiz.id}`; render(); }}, ["แบบประเมินความเห็น"]);
    if(myAttempt){
      btn.appendChild(el("span", {class:"badge badge-sage"}, ["ส่งแล้ว"]));
    }
    actionsRow.appendChild(btn);
  }
  card.appendChild(actionsRow);

  return card;
}

async function getQuizzesForCourses(courseIds){
  if(courseIds.length === 0) return [];
  const results = [];
  // Firestore 'in' supports up to 30 values; fine for our scale
  const snap = await db.collection(COL.quizzes).where("course_id", "in", courseIds.slice(0,30)).get();
  snap.forEach(d => results.push({ id:d.id, ...d.data() }));
  return results;
}

async function getMyAttemptsForQuizzes(quizIds){
  if(quizIds.length === 0) return [];
  const snap = await db.collection(COL.attempts).where("user_id", "==", state.user.uid).get();
  return snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(a => quizIds.includes(a.quiz_id));
}

function latestAttemptFor(attempts, quizId){
  const matches = attempts.filter(a => a.quiz_id === quizId);
  if(matches.length === 0) return null;
  return matches.sort((a,b) => (b.submitted_at_ms||0) - (a.submitted_at_ms||0))[0];
}
</script>

<script>
/* ============================================================
   QUIZ TAKING PAGE
   ============================================================ */
function renderQuizPage(quizId){
  const container = el("div", {});
  const body = el("div", {id:"quiz-body"}, [loadingBox()]);
  container.appendChild(body);

  loadAndRenderQuiz();
  return container;

  async function loadAndRenderQuiz(){
    const quizDoc = await db.collection(COL.quizzes).doc(quizId).get();
    if(!quizDoc.exists){
      body.innerHTML = "";
      body.appendChild(el("div", {class:"card"}, [el("p", {class:"muted"}, ["ไม่พบแบบทดสอบนี้"])]));
      return;
    }
    const quiz = { id: quizDoc.id, ...quizDoc.data() };
    const courseDoc = await db.collection(COL.courses).doc(quiz.course_id).get();
    const course = courseDoc.exists ? courseDoc.data() : {};

    const questionsSnap = await db.collection(COL.questions).where("quiz_id", "==", quizId).get();
    const questions = questionsSnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(a.order_index||0)-(b.order_index||0));

    body.innerHTML = "";
    body.appendChild(el("div", {style:"margin-bottom:24px;"}, [
      el("div", {class:"eyebrow"}, [course.title || ""]),
      el("h2", {class:"page-title", style:"margin-bottom:4px;"}, [quiz.title]),
      el("p", {class:"muted"}, [quiz.kind === "knowledge"
        ? `แบบทดสอบความรู้ — เกณฑ์ผ่าน ${course.pass_score_percent || 70}%`
        : "แบบประเมินความเห็น — ไม่มีคะแนนถูกผิด"]),
    ]));

    if(questions.length === 0){
      body.appendChild(el("div", {class:"card"}, [el("p", {class:"muted"}, ["ยังไม่มีคำถามในแบบทดสอบนี้"])]));
      return;
    }

    renderQuizRunner(body, quiz, course, questions);
  }
}

function renderQuizRunner(body, quiz, course, questions){
  const answers = {}; // questionId -> { choiceId, choiceIds:[], textAnswer }
  const isKnowledge = quiz.kind === "knowledge";

  const formWrap = el("div", {});
  body.appendChild(formWrap);

  function isAllAnswered(){
    return questions.every(q => {
      const a = answers[q.id];
      if(q.kind === "single_choice") return a && a.choiceId;
      if(q.kind === "multiple_choice") return a && a.choiceIds && a.choiceIds.length > 0;
      return a && a.textAnswer && String(a.textAnswer).trim().length > 0;
    });
  }

  function paintQuestions(){
    formWrap.innerHTML = "";
    questions.forEach((q, idx) => {
      const qCard = el("div", {class:"card"});
      qCard.appendChild(el("p", {style:"font-size:14px; font-weight:600; color:var(--ink); margin-bottom:14px;"}, [
        el("span", {class:"q-number"}, [`${idx+1}.`]), q.prompt
      ]));

      if(q.kind === "single_choice" || q.kind === "multiple_choice"){
        const choices = (q.choices || []).slice().sort((a,b)=>(a.order_index||0)-(b.order_index||0));
        choices.forEach(choice => {
          const inputType = q.kind === "single_choice" ? "radio" : "checkbox";
          const row = el("label", {class:"choice-row"});
          const input = el("input", {type:inputType, name:q.id});
          input.addEventListener("change", () => {
            if(q.kind === "single_choice"){
              answers[q.id] = { choiceId: choice.id };
            } else {
              const cur = (answers[q.id] && answers[q.id].choiceIds) || [];
              const next = input.checked ? [...cur, choice.id] : cur.filter(id => id !== choice.id);
              answers[q.id] = { choiceIds: next };
            }
            updateSubmitState();
          });
          row.appendChild(input);
          row.appendChild(document.createTextNode(choice.label));
          qCard.appendChild(row);
        });
      } else if(q.kind === "rating"){
        const row = el("div", {class:"rating-row"});
        [1,2,3,4,5].forEach(n => {
          const b = el("button", {type:"button", class:"rating-btn"}, [String(n)]);
          b.addEventListener("click", () => {
            answers[q.id] = { textAnswer: String(n) };
            row.querySelectorAll(".rating-btn").forEach(x => x.classList.remove("selected"));
            b.classList.add("selected");
            updateSubmitState();
          });
          row.appendChild(b);
        });
        qCard.appendChild(row);
      } else { // text
        const ta = el("textarea", {rows:"3", placeholder:"พิมพ์คำตอบของคุณ..."});
        ta.addEventListener("input", () => {
          answers[q.id] = { textAnswer: ta.value };
          updateSubmitState();
        });
        qCard.appendChild(ta);
      }

      formWrap.appendChild(qCard);
    });

    const errBox = el("div", {class:"alert alert-error hidden", id:"quiz-error"});
    formWrap.appendChild(errBox);

    const submitBtn = el("button", {class:"btn btn-primary", id:"quiz-submit-btn", disabled:"true", onClick: handleSubmit}, ["ส่งคำตอบ"]);
    formWrap.appendChild(submitBtn);
    formWrap.appendChild(el("p", {class:"muted", id:"quiz-hint", style:"margin-top:8px;"}, ["กรุณาตอบทุกข้อก่อนส่ง"]));
  }

  function updateSubmitState(){
    const btn = $("#quiz-submit-btn", formWrap);
    const hint = $("#quiz-hint", formWrap);
    const ready = isAllAnswered();
    btn.disabled = !ready;
    hint.style.display = ready ? "none" : "block";
  }

  async function handleSubmit(){
    const btn = $("#quiz-submit-btn", formWrap);
    const errBox = $("#quiz-error", formWrap);
    errBox.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "กำลังส่ง...";

    try{
      let totalPoints = 0, earnedPoints = 0;
      const answerRows = [];

      questions.forEach(q => {
        const submitted = answers[q.id] || {};
        if(q.kind === "single_choice"){
          totalPoints += isKnowledge ? Number(q.points || 1) : 0;
          const correctChoice = (q.choices||[]).find(c => c.is_correct);
          const isCorrect = isKnowledge ? (submitted.choiceId === (correctChoice && correctChoice.id)) : null;
          if(isKnowledge && isCorrect) earnedPoints += Number(q.points || 1);
          answerRows.push({ question_id:q.id, choice_id:submitted.choiceId || null, text_answer:null, is_correct:isCorrect });
        } else if(q.kind === "multiple_choice"){
          totalPoints += isKnowledge ? Number(q.points || 1) : 0;
          const correctIds = (q.choices||[]).filter(c=>c.is_correct).map(c=>c.id).sort();
          const submittedIds = (submitted.choiceIds||[]).slice().sort();
          const isCorrect = isKnowledge ? (JSON.stringify(correctIds) === JSON.stringify(submittedIds)) : null;
          if(isKnowledge && isCorrect) earnedPoints += Number(q.points || 1);
          answerRows.push({ question_id:q.id, choice_ids:submittedIds, text_answer:null, is_correct:isCorrect });
        } else {
          answerRows.push({ question_id:q.id, choice_id:null, text_answer:submitted.textAnswer || null, is_correct:null });
        }
      });

      const scorePercent = isKnowledge && totalPoints > 0 ? Math.round((earnedPoints/totalPoints)*100) : null;
      const passThreshold = course.pass_score_percent || 70;
      const passed = isKnowledge ? scorePercent >= passThreshold : null;

      await db.collection(COL.attempts).add({
        quiz_id: quiz.id,
        course_id: quiz.course_id,
        user_id: state.user.uid,
        score_percent: scorePercent,
        passed: passed,
        answers: answerRows,
        submitted_at: firebase.firestore.FieldValue.serverTimestamp(),
        submitted_at_ms: Date.now(),
      });

      renderQuizResult(body, quiz, course, scorePercent, passed);
    }catch(err){
      errBox.textContent = err.message || "เกิดข้อผิดพลาดในการส่งคำตอบ";
      errBox.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "ส่งคำตอบ";
    }
  }

  paintQuestions();
}

function renderQuizResult(body, quiz, course, scorePercent, passed){
  body.innerHTML = "";
  const card = el("div", {class:"card", style:"text-align:center; max-width:480px;"});

  if(quiz.kind === "knowledge"){
    card.appendChild(el("div", {class:"eyebrow"}, ["ผลการทดสอบ"]));
    card.appendChild(el("p", {style:`font-size:40px; font-weight:600; font-family:Georgia,serif; color:${passed ? "var(--sage)" : "var(--rust)"}; margin:8px 0;`}, [`${scorePercent}%`]));
    card.appendChild(el("p", {style:"font-weight:600; margin-bottom:24px;"}, [passed ? "✓ ผ่านเกณฑ์" : "✗ ไม่ผ่านเกณฑ์"]));
    if(passed){
      card.appendChild(el("button", {class:"btn btn-outline", style:"margin-bottom:12px;", onClick: () => downloadCertificate(course.title, state.profile.full_name, scorePercent)}, ["ดาวน์โหลด Certificate"]));
      card.appendChild(el("div", {}));
    }
  } else {
    card.appendChild(el("p", {style:"font-size:22px; font-weight:600; font-family:Georgia,serif; color:var(--sage); margin-bottom:8px;"}, ["ส่งแบบประเมินแล้ว"]));
    card.appendChild(el("p", {class:"muted", style:"margin-bottom:24px;"}, ["ขอบคุณสำหรับความเห็นของคุณ"]));
  }

  card.appendChild(el("button", {class:"btn btn-primary", onClick: () => { state.route = "training"; render(); }}, ["กลับไปหน้าคอร์ส"]));
  body.appendChild(card);
}

/* Generate a simple printable certificate (opens a new window formatted for printing/saving as PDF) */
function downloadCertificate(courseTitle, fullName, scorePercent){
  const w = window.open("", "_blank");
  const dateStr = fmtDate(new Date());
  w.document.write(`
    <html><head><title>Certificate</title>
    <style>
      body{ font-family:Georgia,serif; text-align:center; padding:80px; color:#1B3A3A; }
      .border{ border:3px solid #C77B4A; padding:60px; }
      h1{ font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:#2C5454; }
      h2{ font-size:36px; margin:24px 0; }
      .name{ font-size:28px; font-weight:bold; margin:24px 0; border-bottom:2px solid #E2DDD2; display:inline-block; padding-bottom:8px; }
      .meta{ color:#2C5454; margin-top:32px; font-size:14px; }
    </style></head>
    <body>
      <div class="border">
        <h1>Certificate of Completion</h1>
        <h2>MedTrain</h2>
        <p>This certifies that</p>
        <div class="name">${escapeHtml(fullName)}</div>
        <p>has successfully completed</p>
        <p style="font-size:20px; font-weight:bold; margin:16px 0;">${escapeHtml(courseTitle)}</p>
        <p>with a score of ${scorePercent}%</p>
        <div class="meta">Issued: ${dateStr}</div>
      </div>
      <scr` + `ipt>window.print();</scr` + `ipt>
    </body></html>
  `);
  w.document.close();
}
</script>

<script>
/* ============================================================
   PROFILE VIEW — light personal info, owner can edit own profile
   ============================================================ */
function renderProfile(){
  const p = state.profile;
  const container = el("div", {});
  container.appendChild(el("div", {style:"margin-bottom:24px;"}, [
    el("div", {class:"eyebrow"}, ["โปรไฟล์"]),
    el("h2", {class:"page-title", style:"margin-bottom:0;"}, ["ข้อมูลส่วนตัว"]),
  ]));

  const card = el("div", {class:"card", style:"max-width:520px;"});

  const headRow = el("div", {style:"display:flex; align-items:center; gap:16px; margin-bottom:24px;"});
  const avatar = el("div", {class:"profile-avatar"});
  if(p.photo_url){
    avatar.appendChild(el("img", {src:p.photo_url, alt:""}));
  } else {
    avatar.textContent = (p.full_name || "?").trim().charAt(0).toUpperCase();
  }
  headRow.appendChild(avatar);
  headRow.appendChild(el("div", {}, [
    el("p", {style:"font-weight:600; font-size:16px;"}, [p.full_name]),
    el("p", {class:"muted"}, [ROLE_LABEL[p.role] || p.role]),
  ]));
  card.appendChild(headRow);

  const successBox = el("div", {class:"alert alert-success hidden"}, ["บันทึกแล้ว"]);
  card.appendChild(successBox);

  const rowPhotoUrl = el("div", {class:"field"}, [
    el("label", {}, ["ลิงก์รูปโปรไฟล์ (ไม่บังคับ)"]),
    el("input", {type:"url", id:"p-photo", value:p.photo_url || "", placeholder:"https://..."}),
  ]);
  card.appendChild(rowPhotoUrl);

  card.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["เบอร์โทร"]),
    el("input", {type:"tel", id:"p-phone", value:p.phone || ""}),
  ]));

  const row2 = el("div", {class:"field-row field-row-2"});
  row2.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["แผนก"]),
    el("input", {type:"text", id:"p-department", value:p.department || ""}),
  ]));
  row2.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["สาขาความเชี่ยวชาญ"]),
    el("input", {type:"text", id:"p-specialty", value:p.specialty || ""}),
  ]));
  card.appendChild(row2);

  card.appendChild(el("button", {class:"btn btn-primary", onClick: handleSave}, ["บันทึกการเปลี่ยนแปลง"]));
  container.appendChild(card);

  // ---------- Change PIN card ----------
  const pinCard = el("div", {class:"card", style:"max-width:520px;"});
  pinCard.appendChild(el("p", {class:"eyebrow", style:"margin-bottom:12px;"}, ["เปลี่ยน PIN"]));

  const pinErrBox = el("div", {class:"alert alert-error hidden"});
  pinCard.appendChild(pinErrBox);
  const pinSuccessBox = el("div", {class:"alert alert-success hidden"}, ["เปลี่ยน PIN สำเร็จ"]);
  pinCard.appendChild(pinSuccessBox);

  pinCard.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["PIN เดิม"]),
    el("input", {type:"tel", inputmode:"numeric", maxlength:"6", id:"pin-old", style:"letter-spacing:0.2em;"}),
  ]));
  pinCard.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["PIN ใหม่ (6 หลัก)"]),
    el("input", {type:"tel", inputmode:"numeric", maxlength:"6", id:"pin-new", style:"letter-spacing:0.2em;"}),
  ]));
  pinCard.appendChild(el("div", {class:"field"}, [
    el("label", {}, ["ยืนยัน PIN ใหม่"]),
    el("input", {type:"tel", inputmode:"numeric", maxlength:"6", id:"pin-confirm", style:"letter-spacing:0.2em;"}),
  ]));

  const pinBtn = el("button", {class:"btn btn-primary"}, ["เปลี่ยน PIN"]);
  pinBtn.addEventListener("click", handleChangePin);
  pinCard.appendChild(pinBtn);
  container.appendChild(pinCard);

  async function handleSave(){
    const updates = {
      photo_url: $("#p-photo", card).value.trim(),
      phone: $("#p-phone", card).value.trim(),
      department: $("#p-department", card).value.trim(),
      specialty: $("#p-specialty", card).value.trim(),
    };
    await db.collection(COL.profiles).doc(state.user.uid).update(updates);
    await db.collection(COL.loginDirectory).doc(state.user.uid).update({ photo_url: updates.photo_url });
    Object.assign(state.profile, updates);
    successBox.classList.remove("hidden");
    setTimeout(() => successBox.classList.add("hidden"), 2500);
  }

  async function handleChangePin(){
    const oldPin = $("#pin-old", pinCard).value.trim();
    const newPin = $("#pin-new", pinCard).value.trim();
    const confirmPin = $("#pin-confirm", pinCard).value.trim();
    pinErrBox.classList.add("hidden");
    pinSuccessBox.classList.add("hidden");

    if(!/^[0-9]{6}$/.test(newPin)){
      pinErrBox.textContent = "PIN ใหม่ต้องเป็นตัวเลข 6 หลัก";
      pinErrBox.classList.remove("hidden");
      return;
    }
    if(newPin !== confirmPin){
      pinErrBox.textContent = "PIN ใหม่ทั้งสองช่องไม่ตรงกัน";
      pinErrBox.classList.remove("hidden");
      return;
    }

    pinBtn.disabled = true;
    pinBtn.textContent = "กำลังเปลี่ยน...";

    try{
      const ownEmail = state.profile.auth_email || `${state.user.uid}@medtrain.local`;
      const credential = firebase.auth.EmailAuthProvider.credential(ownEmail, oldPin);
      await state.user.reauthenticateWithCredential(credential);
      await state.user.updatePassword(newPin);
      pinSuccessBox.classList.remove("hidden");
      $("#pin-old", pinCard).value = "";
      $("#pin-new", pinCard).value = "";
      $("#pin-confirm", pinCard).value = "";
    }catch(err){
      const code = err && err.code;
      if(code === "auth/wrong-password" || code === "auth/invalid-credential"){
        pinErrBox.textContent = "PIN เดิมไม่ถูกต้อง";
      } else {
        pinErrBox.textContent = err.message || "เกิดข้อผิดพลาด";
      }
      pinErrBox.classList.remove("hidden");
    }finally{
      pinBtn.disabled = false;
      pinBtn.textContent = "เปลี่ยน PIN";
    }
  }

  return container;
}
</script>

<script>
/* ============================================================
   ADMIN: USER MANAGEMENT
   ============================================================ */
function renderAdminUsers(){
  const container = el("div", {});
  container.appendChild(adminBreadcrumb("ผู้ใช้งาน"));

  const createCard = el("div", {class:"card", style:"margin-bottom:24px;"});
  container.appendChild(createCard);
  paintCreateForm(createCard);

  const listBox = el("div", {id:"admin-users-list"}, [loadingBox()]);
  container.appendChild(listBox);

  loadUsers();
  return container;

  function paintCreateForm(card){
    card.innerHTML = "";
    card.appendChild(el("p", {class:"eyebrow", style:"margin-bottom:12px;"}, ["เพิ่มผู้ใช้งานใหม่"]));
    card.appendChild(el("p", {class:"muted", style:"margin-bottom:16px;"}, ["ระบบจะสุ่ม PIN 6 หลักให้อัตโนมัติ — กรุณาบันทึก PIN ไว้บอกเจ้าตัว เพราะจะแสดงให้เห็นครั้งเดียวเท่านั้น"]));

    const errBox = el("div", {class:"alert alert-error hidden"});
    card.appendChild(errBox);
    const resultBox = el("div", {class:"alert alert-success hidden"});
    card.appendChild(resultBox);

    const row = el("div", {class:"field-row field-row-2"});
    row.appendChild(el("div", {class:"field"}, [
      el("label", {}, ["ชื่อ-นามสกุล"]),
      el("input", {type:"text", id:"nu-name"}),
    ]));
    const roleSelect = el("select", {id:"nu-role"}, [
      el("option", {value:"staff"}, ["พนักงานทั่วไป"]),
      el("option", {value:"doctor"}, ["แพทย์"]),
      el("option", {value:"admin"}, ["ผู้ดูแลระบบ"]),
    ]);
    row.appendChild(el("div", {class:"field"}, [el("label", {}, ["บทบาท"]), roleSelect]));
    card.appendChild(row);

    const submitBtn = el("button", {class:"btn btn-primary"}, ["สร้างผู้ใช้งาน"]);
    submitBtn.addEventListener("click", handleCreate);
    card.appendChild(submitBtn);

    async function handleCreate(){
      const fullName = $("#nu-name", card).value.trim();
      const role = $("#nu-role", card).value;
      errBox.classList.add("hidden");
      resultBox.classList.add("hidden");

      if(!fullName){
        errBox.textContent = "กรุณากรอกชื่อ-นามสกุล";
        errBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังสร้าง...";

      try{
        const pin = randomPin();
        const placeholderEmail = `tmp_${randomToken(12)}@medtrain.local`;

        // Create the auth account on the SECONDARY app instance so the admin's
        // own session (on the primary `auth` instance) is not affected.
        // We never rename this email afterward (Firebase requires verifying a new
        // email before updateEmail() succeeds, which synthetic local addresses can
        // never satisfy) — instead we store it as auth_email for future logins.
        const cred = await secondaryAuth.createUserWithEmailAndPassword(placeholderEmail, pin);
        const newUid = cred.user.uid;

        await db.collection(COL.profiles).doc(newUid).set({
          full_name: fullName,
          role: role,
          is_active: true,
          auth_email: placeholderEmail,
          phone: "", department: "", specialty: "", photo_url: "",
          created_at: firebase.firestore.FieldValue.serverTimestamp(),
        });
        await db.collection(COL.loginDirectory).doc(newUid).set({
          full_name: fullName, role: role, is_active: true, photo_url: "",
          auth_email: placeholderEmail,
        });

        await secondaryAuth.signOut();

        resultBox.textContent = `สร้างสำเร็จ — PIN ของ "${fullName}" คือ ${pin} (กรุณาบันทึกไว้ ระบบจะไม่แสดงอีก)`;
        resultBox.classList.remove("hidden");
        $("#nu-name", card).value = "";
        loadUsers();
      }catch(err){
        errBox.textContent = err.message || "เกิดข้อผิดพลาดในการสร้างผู้ใช้";
        errBox.classList.remove("hidden");
      }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = "สร้างผู้ใช้งาน";
      }
    }
  }

  async function loadUsers(){
    const snap = await db.collection(COL.profiles).orderBy("created_at", "desc").get();
    const users = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    listBox.innerHTML = "";

    if(window.innerWidth < 640){
      users.forEach(u => listBox.appendChild(renderUserCardMobile(u)));
    } else {
      listBox.appendChild(renderUserTable(users));
    }
  }

  function renderUserCardMobile(u){
    const card = el("div", {class:"card", style:"margin-bottom:12px;"});
    const top = el("div", {style:"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;"});
    top.appendChild(el("div", {}, [
      el("p", {style:"font-weight:600;"}, [u.full_name, u.id === state.user.uid ? el("span", {class:"muted", style:"font-weight:400; margin-left:6px;"}, ["(คุณ)"]) : ""]),
    ]));
    const activeBtn = el("button", {class:"badge " + (u.is_active !== false ? "badge-sage" : "badge-rust"), style:"border:none; cursor:pointer;", disabled: u.id===state.user.uid ? "true" : null}, [u.is_active !== false ? "ใช้งานได้" : "ปิดใช้งาน"]);
    activeBtn.addEventListener("click", () => toggleActive(u, activeBtn));
    top.appendChild(activeBtn);
    card.appendChild(top);

    const select = el("select", {style:"width:100%; margin-bottom:8px;", disabled: u.id===state.user.uid ? "true" : null});
    ["staff","doctor","admin"].forEach(r => select.appendChild(el("option", {value:r, selected: u.role===r ? "true" : null}, [ROLE_LABEL[r]])));
    select.addEventListener("change", () => updateRole(u, select.value));
    card.appendChild(select);

    const resetBtn = el("button", {class:"btn-ghost", style:"background:none; border:1px solid var(--line); border-radius:4px; cursor:pointer; padding:8px 12px; font-size:13px; width:100%;"}, ["รีเซ็ต PIN"]);
    resetBtn.addEventListener("click", () => resetPin(u, resetBtn));
    card.appendChild(resetBtn);
    return card;
  }

  function renderUserTable(users){
    const wrap = el("div", {class:"table-wrap"});
    const table = el("table", {class:"simple-table"});
    table.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", {}, ["ชื่อ"]), el("th", {}, ["บทบาท"]), el("th", {}, ["สถานะ"]), el("th", {}, ["PIN"])
    ])]));
    const tbody = el("tbody", {});
    users.forEach(u => {
      const tr = el("tr", {});
      tr.appendChild(el("td", {style:"font-weight:600; color:var(--ink);"}, [u.full_name, u.id===state.user.uid ? el("span",{class:"muted", style:"font-weight:400; margin-left:6px;"},["(คุณ)"]) : ""]));

      const select = el("select", {disabled: u.id===state.user.uid ? "true" : null});
      ["staff","doctor","admin"].forEach(r => select.appendChild(el("option", {value:r, selected: u.role===r ? "true" : null}, [ROLE_LABEL[r]])));
      select.addEventListener("change", () => updateRole(u, select.value));
      tr.appendChild(el("td", {}, [select]));

      const activeBtn = el("button", {class:"badge " + (u.is_active !== false ? "badge-sage" : "badge-rust"), style:"border:none; cursor:pointer;", disabled: u.id===state.user.uid ? "true" : null}, [u.is_active !== false ? "ใช้งานได้" : "ปิดใช้งาน"]);
      activeBtn.addEventListener("click", () => toggleActive(u, activeBtn));
      tr.appendChild(el("td", {}, [activeBtn]));

      const resetBtn = el("button", {class:"btn-danger-text"}, ["รีเซ็ต PIN"]);
      resetBtn.addEventListener("click", () => resetPin(u, resetBtn));
      tr.appendChild(el("td", {}, [resetBtn]));

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  async function updateRole(u, newRole){
    await db.collection(COL.profiles).doc(u.id).update({ role: newRole });
    await db.collection(COL.loginDirectory).doc(u.id).update({ role: newRole });
    u.role = newRole;
  }
  async function toggleActive(u, btn){
    const next = !(u.is_active !== false);
    await db.collection(COL.profiles).doc(u.id).update({ is_active: next });
    await db.collection(COL.loginDirectory).doc(u.id).update({ is_active: next });
    u.is_active = next;
    btn.className = "badge " + (next ? "badge-sage" : "badge-rust");
    btn.textContent = next ? "ใช้งานได้" : "ปิดใช้งาน";
  }

  async function resetPin(u, btn){
    if(u.id === state.user.uid){
      alert("ไปที่หน้าโปรไฟล์เพื่อเปลี่ยน PIN ของคุณเอง");
      return;
    }
    const confirmed = confirm(
      `Firebase ไม่อนุญาตให้ Admin เปลี่ยน PIN ของคนอื่นโดยตรงจากฝั่งหน้าเว็บ (ต้องมี server)\n\n` +
      `ทางเลือก: ระบบจะปิดการใช้งานบัญชีเดิมของ "${u.full_name}" และสร้างบัญชีใหม่ให้แทน พร้อม PIN ใหม่แบบสุ่ม ` +
      `(ประวัติคะแนนเดิมจะยังอยู่ในระบบ แต่จะผูกกับบัญชีเก่าที่ปิดใช้งานแล้ว ไม่โอนมาบัญชีใหม่)\n\n` +
      `ดำเนินการต่อ?`
    );
    if(!confirmed) return;

    btn.disabled = true;

    try{
      // Deactivate the old profile + remove from login picker
      await db.collection(COL.profiles).doc(u.id).update({ is_active: false });
      await db.collection(COL.loginDirectory).doc(u.id).update({ is_active: false });

      // Create a brand-new account for this person with a fresh PIN
      const pin = randomPin();
      const placeholderEmail = `tmp_${randomToken(12)}@medtrain.local`;
      const cred = await secondaryAuth.createUserWithEmailAndPassword(placeholderEmail, pin);
      const newUid = cred.user.uid;

      await db.collection(COL.profiles).doc(newUid).set({
        full_name: u.full_name, role: u.role, is_active: true,
        auth_email: placeholderEmail,
        phone: u.phone || "", department: u.department || "", specialty: u.specialty || "", photo_url: u.photo_url || "",
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection(COL.loginDirectory).doc(newUid).set({
        full_name: u.full_name, role: u.role, is_active: true, photo_url: u.photo_url || "",
        auth_email: placeholderEmail,
      });
      await secondaryAuth.signOut();

      alert(`สร้างบัญชีใหม่ให้ "${u.full_name}" แล้ว — PIN ใหม่คือ ${pin} (กรุณาบันทึกไว้ ระบบจะไม่แสดงอีก)`);
      loadUsers();
    }catch(err){
      alert(err.message || "เกิดข้อผิดพลาด");
      btn.disabled = false;
    }
  }
}

  wrap.appendChild(el("a", {href:"#", class:"muted", style:"text-decoration:none; font-size:13px;", onClick:(e)=>{e.preventDefault(); state.route = backRoute || "admin"; render();}}, ["← กลับ"]));
  wrap.appendChild(el("div", {class:"eyebrow", style:"margin-top:8px;"}, ["ผู้ดูแลระบบ"]));
  wrap.appendChild(el("h2", {class:"page-title", style:"margin-bottom:0;"}, [title]));
  return wrap;
}

<script>
/* ============================================================
   ADMIN: COURSES LIST
   ============================================================ */
function renderAdminCourses(){
  const container = el("div", {});
  const crumb = adminBreadcrumb("คอร์สและแบบทดสอบ");
  const headerRow = el("div", {style:"display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:0;"});

  container.appendChild(crumb);

  const addBtn = el("button", {class:"btn btn-primary", style:"margin-bottom:24px;", onClick: ()=>{ state.route = "admin:course:new"; render(); }}, ["+ เพิ่มคอร์สใหม่"]);

      top.appendChild(el("span", {class:"badge " + (c.is_published ? "badge-sage" : "badge-neutral")}, [c.is_published ? "เผยแพร่แล้ว" : "ยังไม่เผยแพร่"]));

/* ============================================================
   ADMIN: COURSE DETAIL (create / edit + quiz editors)
   ============================================================ */
function renderAdminCourseDetail(courseId){
  const isNew = courseId === "new";
  const container = el("div", {});
  container.appendChild(adminBreadcrumb(isNew ? "เพิ่มคอร์สใหม่" : "แก้ไขคอร์ส", "admin:courses"));

  const formCard = el("div", {class:"card", style:"margin-bottom:24px;"}, [el("div", {class:"spinner"})]);
  container.appendChild(formCard);

  const quizSection = el("div", {id:"quiz-section"});

  if(isNew){
    paintCourseForm(formCard, {
      title:"", description:"", link_url:"", pass_score_percent:70, due_date:"", is_published:true
    }, null);
  } else {
    db.collection(COL.courses).doc(courseId).get().then(snap => {
      const course = { id:snap.id, ...snap.data() };
      paintCourseForm(formCard, course, courseId);
      paintQuizSection(quizSection, courseId, course);
